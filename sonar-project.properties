# Configuración oficial de SonarQube (SAST) para PetCare Backend (Evaluación N.º 4)
sonar.projectKey=petcare-eva4-backend
sonar.projectName=PetCare - API RESTful Veterinaria (EVA 4 AWS & Seguridad)
sonar.projectVersion=2.0.0

# Rutas del código fuente Python/Django a analizar
sonar.sources=petcare_config,users,clinica
sonar.tests=clinica
sonar.test.inclusions=clinica/tests.py
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/static/**,**/venv/**,**/.venv/**

# Codificación y versión de Python
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12
